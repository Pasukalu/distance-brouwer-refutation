name: Verify Lean proofs

on:
  push:
    branches: [main]
    paths:
      - "lean/**"
      - "verification/check_lean_hygiene.py"
      - ".github/workflows/verify-lean.yml"
  pull_request:
    paths:
      - "lean/**"
      - "verification/check_lean_hygiene.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: lake build (zero sorry, zero dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Lean hygiene check (no sorry/axiom, 18 axiom audits)
        run: python3 verification/check_lean_hygiene.py

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        working-directory: lean
        run: |
          lake --version
          lake build
