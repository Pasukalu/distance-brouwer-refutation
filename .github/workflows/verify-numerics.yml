name: Verify numerical census and certificates
on:
  push:
    branches: [main]
    paths: ['python/**', 'cpp/**', 'requirements.txt', '.github/workflows/verify-numerics.yml']
  pull_request:
    paths: ['python/**', 'cpp/**', 'requirements.txt', '.github/workflows/verify-numerics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python python/verify_all.py
      - run: |
          g++ -O3 -std=c++17 cpp/enum_n7.cpp -o /tmp/enum_n7
          /tmp/enum_n7 > n7_masks.txt
          test "$(wc -l < n7_masks.txt)" -eq 853
          python python/analyze_n7_and_plot.py
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-results
          path: |
            n7_masks.txt
            paper/figures/
